name: OCR Class 8 Textbooks

on:
  workflow_dispatch:
    inputs:
      books:
        description: "Comma bookIds (empty = all)"
        required: false
        default: ""
      dpi:
        description: "Render DPI for pages that need OCR"
        required: false
        default: "100"
      workers:
        description: "Parallel OCR workers per book"
        required: false
        default: "4"

concurrency:
  group: ocr-textbooks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        env:
          BOOKS_FILTER: ${{ github.event.inputs.books }}
        run: |
          python3 << 'PY'
          import json, os
          cat = json.load(open("books_catalog.json"))
          books = cat["books"]
          filt = (os.environ.get("BOOKS_FILTER") or "").strip()
          if filt:
              want = {x.strip() for x in filt.split(",") if x.strip()}
              books = [b for b in books if b["bookId"] in want]
          if not books:
              raise SystemExit("No books selected")
          matrix = {"include": books}
          line = json.dumps(matrix, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={line}\n")
          print(json.dumps(matrix, indent=2))
          PY

  ocr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-urd poppler-utils

      - name: Extract / OCR ${{ matrix.bookId }}
        env:
          PYTHONUNBUFFERED: "1"
          DPI: ${{ github.event.inputs.dpi || '100' }}
          WORKERS: ${{ github.event.inputs.workers || '4' }}
        run: |
          python3 scripts/ci_ocr_book.py \
            "${{ matrix.bookId }}" \
            "${{ matrix.title }}" \
            "${{ matrix.driveId }}" \
            "${{ matrix.langs }}" \
            "$DPI" \
            "$WORKERS"

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.bookId }}
          path: books/${{ matrix.bookId }}/data.json
          if-no-files-found: error
          retention-days: 7

  merge-and-push:
    needs: ocr
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: book-*
          merge-multiple: false

      - name: Place JSON + rebuild index
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in _artifacts/book-*; do
            bid="${dir#*_artifacts/book-}"
            if [[ -f "$dir/data.json" ]]; then
              mkdir -p "books/$bid"
              cp "$dir/data.json" "books/$bid/data.json"
              echo "placed $bid ($(wc -c < books/$bid/data.json) bytes)"
            fi
          done
          python3 scripts/ci_build_index.py
          cat index.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books index.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ocr: update textbook page text (text-layer + selective OCR)"
          git push
