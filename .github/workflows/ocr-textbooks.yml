name: OCR Class 8 Textbooks

on:
  workflow_dispatch:
    inputs:
      books:
        description: "Comma-separated bookIds (empty = all from books_catalog.json)"
        required: false
        default: ""
      dpi:
        description: "OCR DPI (120–200; higher = sharper, slower)"
        required: false
        default: "120"
      workers:
        description: "Parallel OCR threads per book job"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: ocr-textbooks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        env:
          FILTER: ${{ github.event.inputs.books }}
        run: |
          python3 - <<'PY'
          import json, os
          catalog = json.load(open("books_catalog.json"))
          books = catalog["books"]
          filt = (os.environ.get("FILTER") or "").strip()
          if filt:
              want = {x.strip() for x in filt.split(",") if x.strip()}
              books = [b for b in books if b["bookId"] in want]
          if not books:
              raise SystemExit("No books selected")
          matrix = {"include": books}
          # compact single-line for GITHUB_OUTPUT
          line = json.dumps(matrix, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={line}\n")
          print(json.dumps(matrix, indent=2))
          PY

  ocr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-urd poppler-utils imagemagick

      - name: OCR ${{ matrix.bookId }}
        env:
          PYTHONUNBUFFERED: "1"
          DPI: ${{ github.event.inputs.dpi || '120' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: |
          python3 scripts/ci_ocr_book.py \
            "${{ matrix.bookId }}" \
            "${{ matrix.title }}" \
            "${{ matrix.driveId }}" \
            "${{ matrix.langs }}" \
            "$DPI" \
            "$WORKERS"

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.bookId }}
          path: books/${{ matrix.bookId }}/data.json
          if-no-files-found: error
          retention-days: 7

  merge-and-push:
    needs: ocr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all book artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: book-*
          merge-multiple: false

      - name: Place JSON + rebuild index
        run: |
          set -euo pipefail
          for dir in _artifacts/book-*; do
            bid="${dir#*_artifacts/book-}"
            mkdir -p "books/$bid"
            cp "$dir/data.json" "books/$bid/data.json"
            echo "placed $bid ($(wc -c < books/$bid/data.json) bytes)"
          done
          python3 scripts/ci_build_index.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books index.json books_catalog.json scripts .github
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci: OCR textbook pages ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main || true
          git push origin HEAD:main
